<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Heroes Path Calculator (Snow Coins)</title>
  <style>
    :root{
      --bg:#0b0f14; --card:#121826; --card2:#0f1522; --text:#e6edf7; --muted:#9fb0c8;
      --line:#1f2a3d; --good:#35d07f; --warn:#ffcc66; --bad:#ff5c7a; --accent:#7aa7ff;
    }
    *{box-sizing:border-box}
    body{margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; background:var(--bg); color:var(--text)}
    .wrap{max-width:980px; margin:20px auto; padding:0 14px}
    h1{font-size:20px; margin:0 0 12px}
    .grid{display:grid; grid-template-columns:repeat(12,1fr); gap:12px}
    .card{background:linear-gradient(180deg,var(--card),var(--card2)); border:1px solid var(--line);
      border-radius:14px; padding:14px}
    .card h2{font-size:14px; margin:0 0 10px; color:var(--muted); font-weight:650}
    .row{display:flex; gap:10px; flex-wrap:wrap}
    .field{flex:1 1 160px}
    label{display:block; font-size:12px; color:var(--muted); margin:0 0 6px}
    input[type="number"]{
      width:100%; padding:10px; border-radius:10px; border:1px solid var(--line);
      background:#0b1220; color:var(--text);
    }
    .btnrow{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px}
    button{
      padding:10px 12px; border-radius:10px; border:1px solid var(--line);
      background:#0b1220; color:var(--text); cursor:pointer;
    }
    .pill{display:inline-flex; padding:8px 10px; border-radius:999px;
      border:1px solid var(--line); background:#0b1220; color:var(--muted); font-size:12px}
    .kpi{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
    .k{border:1px solid var(--line); background:#0b1220; border-radius:12px; padding:12px}
    .k .t{font-size:12px; color:var(--muted)}
    .k .v{font-size:18px; margin-top:6px; font-weight:750}
    .bar{height:10px; background:#0b1220; border:1px solid var(--line); border-radius:999px; overflow:hidden}
    .fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),#9b7aff)}
    table{width:100%; border-collapse:collapse; margin-top:10px}
    th,td{padding:10px 8px; border-bottom:1px solid var(--line); text-align:right; font-size:13px}
    th:first-child, td:first-child{text-align:left}
    .subtle{color:var(--muted); font-size:12px; margin-top:8px}
    .ok{color:var(--good)} .no{color:var(--bad)} .mid{color:var(--warn)}
    .col-6{grid-column:span 6}
    .col-12{grid-column:span 12}
    @media (max-width:860px){ .col-6{grid-column:span 12} .kpi{grid-template-columns:1fr} }
  </style>
</head>
<body>
<div class="wrap">
<h1>Heroes Path Calculator — Snow Coins</h1>

<div class="grid">

<!-- SETTINGS -->
<div class="card col-6">
  <h2>Targets & Rates</h2>
  <div class="row">
    <div class="field">
      <label>Target: One Soul (Snow Coins)</label>
      <input id="targetOne" type="number" value="74250">
    </div>
    <div class="field">
      <label>Target: Both Souls (Snow Coins)</label>
      <input id="targetBoth" type="number" value="141000">
    </div>
  </div>
  <div class="row" style="margin-top:10px">
    <div class="field">
      <label>Champion Training (Snow Coins per Energy)</label>
      <input id="ptsPerEnergy" type="number" value="4.9" step="0.1">
    </div>
    <div class="field">
      <label>Extra Manual Snow Coins</label>
      <input id="manualPts" type="number" value="0">
    </div>
  </div>
</div>

<!-- INPUTS -->
<div class="card col-6">
  <h2>Player Inputs</h2>
  <div class="row">
    <div class="field"><label>Mystery Shards</label><input id="mystery" type="number"></div>
    <div class="field"><label>Ancient Shards</label><input id="ancient" type="number"></div>
    <div class="field"><label>Void Shards</label><input id="void" type="number"></div>
  </div>
  <div class="row" style="margin-top:10px">
    <div class="field"><label>Primal Shards</label><input id="primal" type="number"></div>
    <div class="field"><label>Sacred Shards</label><input id="sacred" type="number"></div>
    <div class="field"><label>Energy Spent (Training)</label><input id="energy" type="number"></div>
  </div>
</div>

<!-- SUMMARY -->
<div class="card col-12">
  <h2>Summary</h2>
  <div class="kpi">
    <div class="k">
      <div class="t">Total Snow Coins</div>
      <div class="v" id="totalPts">0</div>
    </div>
    <div class="k">
      <div class="t">One Soul Progress</div>
      <div class="v" id="pOne">0%</div>
      <div class="bar"><div class="fill" id="barOne"></div></div>
    </div>
    <div class="k">
      <div class="t">Both Souls Progress</div>
      <div class="v" id="pBoth">0%</div>
      <div class="bar"><div class="fill" id="barBoth"></div></div>
    </div>
  </div>
</div>

</div>
</div>

<script>
const $ = id => document.getElementById(id);
const vals = {
  mystery:3, ancient:300, void:750, primal:1800, sacred:4500
};
document.querySelectorAll("input").forEach(i=>i.addEventListener("input",calc));

function calc(){
  const t1=+targetOne.value||0, t2=+targetBoth.value||0;
  const ppe=+ptsPerEnergy.value||0, manual=+manualPts.value||0;
  let total = manual + (+energy.value||0)*ppe;
  for(const k in vals) total += (+$(k).value||0)*vals[k];

  totalPts.textContent = Math.round(total).toLocaleString();
  pOne.textContent = ((total/t1)*100||0).toFixed(1)+"%";
  pBoth.textContent = ((total/t2)*100||0).toFixed(1)+"%";
  barOne.style.width=Math.min(100,(total/t1)*100)+"%";
  barBoth.style.width=Math.min(100,(total/t2)*100)+"%";
}
calc();
</script>
</body>
</html>
